services:
  agent:
    build:
      context: .
      secrets:
        - github_token
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bahia}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-db_chiefofstaff}
      POSTGRES_USER: ${POSTGRES_USER:-personal_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      RADAR_API_KEY: ${RADAR_API_KEY:-}
      TELEGRAM_AUDIO_MAX_BYTES: ${TELEGRAM_AUDIO_MAX_BYTES:-}
      TELEGRAM_AUDIO_MAX_DURATION_SECONDS: ${TELEGRAM_AUDIO_MAX_DURATION_SECONDS:-}
      TELEGRAM_ATTACHMENTS_ENABLED: ${TELEGRAM_ATTACHMENTS_ENABLED:-}
      TELEGRAM_DOCUMENT_MAX_BYTES: ${TELEGRAM_DOCUMENT_MAX_BYTES:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_LANGUAGE: ${STT_LANGUAGE:-}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-}
      STT_MAX_BYTES: ${STT_MAX_BYTES:-}
      NOTION_ENABLED: ${NOTION_ENABLED:-false}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_TASK_DATA_SOURCE_ID: ${NOTION_TASK_DATA_SOURCE_ID:-}
      NOTION_PROJECT_DATA_SOURCE_ID: ${NOTION_PROJECT_DATA_SOURCE_ID:-}
      NOTION_TASK_DATABASE_ID: ${NOTION_TASK_DATABASE_ID:-}
      NOTION_PROJECT_DATABASE_ID: ${NOTION_PROJECT_DATABASE_ID:-}
      NOTION_PEOPLE_DATA_SOURCE_ID: ${NOTION_PEOPLE_DATA_SOURCE_ID:-}
      NOTION_PEOPLE_DATABASE_ID: ${NOTION_PEOPLE_DATABASE_ID:-}
      NOTION_REFERENCE_DATA_SOURCE_ID: ${NOTION_REFERENCE_DATA_SOURCE_ID:-}
      NOTION_REFERENCE_DATABASE_ID: ${NOTION_REFERENCE_DATABASE_ID:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
      GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN:-}
      GMAIL_ENABLED: ${GMAIL_ENABLED:-false}
      GOOGLE_GMAIL_REFRESH_TOKEN: ${GOOGLE_GMAIL_REFRESH_TOKEN:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-}
      AGENT_TOOL_CALL_BUDGET: ${AGENT_TOOL_CALL_BUDGET:-16}
      AGENT_IDENTICAL_TOOL_CALL_BUDGET: ${AGENT_IDENTICAL_TOOL_CALL_BUDGET:-2}
      RADAR_AGENT_RUNTIME_TOKEN: ${RADAR_AGENT_RUNTIME_TOKEN:-}
      RADAR_BACKEND: ${RADAR_BACKEND:-vault}
      RADAR_COMMAND_URL: ${RADAR_COMMAND_URL:-}
      RADAR_COMMAND_TOKEN: ${RADAR_COMMAND_TOKEN:-}
      RADAR_ENABLED: ${RADAR_ENABLED:-false}
      RADAR_VAULT_PATH: ${RADAR_VAULT_PATH:-/data/radar-vault}
      RADAR_CONTEXT: ${RADAR_CONTEXT:-}
      RADAR_PERSON_ID: ${RADAR_PERSON_ID:-}
      RADAR_ALLOWED_TBOX_VERSIONS: ${RADAR_ALLOWED_TBOX_VERSIONS:-3.2.0}
      RADAR_WRITES_ENABLED: ${RADAR_WRITES_ENABLED:-false}
      RADAR_WRITE_OPERATIONS: ${RADAR_WRITE_OPERATIONS:-capture_issue,delegate,review,record_measurement}
      RADAR_MANAGER_CONTEXTS: ${RADAR_MANAGER_CONTEXTS:-}
      RADAR_APPROVAL_TTL_SECONDS: ${RADAR_APPROVAL_TTL_SECONDS:-900}
      RADAR_INTENT_DEDUP_WINDOW_SECONDS: ${RADAR_INTENT_DEDUP_WINDOW_SECONDS:-86400}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - radar_abox:/data/radar-vault
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_chiefofstaff}
      POSTGRES_USER: ${POSTGRES_USER:-personal_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_EXPOSED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  radar_abox:

secrets:
  github_token:
    environment: GITHUB_TOKEN
